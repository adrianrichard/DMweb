<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>{% block title %}DENTALMATIC{% endblock %}</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% if current_user.is_authenticated %}
    <nav class="navbar navbar-light bg-light border-bottom mb-3">
        <div class="container">
            <a href="{{ url_for('auth.post_login_redirect') }}" class="btn btn-sm btn-outline-primary">
                ⬅ Menú principal
            </a>
            <span class="navbar-text">DENTALMATIC</span>
        </div>
    </nav>
    {% endif %}
    <div class="container mt-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
