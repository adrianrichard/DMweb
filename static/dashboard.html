<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DentalMatic - Dashboard</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="brand">DentalMatic</div>
        <nav>
            <a href="/dashboard" class="active">🏠 Inicio</a>
            <a href="/usuarios-view">👥 Usuarios</a>
            <a href="/odontologos-view">👨‍⚕️ Odontólogos</a>
            <a href="/pacientes-view">📋 Pacientes</a>
            <a href="/turnos-view">📅 Turnos</a>
            <a href="/historia-clinica-view">🦷 Historia Clínica</a>
        </nav>
        <div class="user-panel">
            <div id="userInfo" style="margin-bottom: 0.5rem; font-weight: bold;"></div>
            <button class="btn btn-danger" onclick="logout()" style="width: 100%; font-size: 0.8rem;">Cerrar Sesión</button>
        </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
        <h2>Bienvenido al Sistema Odontológico</h2>
        <p style="color: #666; margin-top: 0.5rem;">Selecciona cualquiera de las opciones del menú lateral para gestionar el sistema.</p>
    </main>

    <script>
        const userSession = JSON.parse(localStorage.getItem('user'));
        if (!userSession || !userSession.nombre_usuario) {
            window.location.href = '/';
        } else {
            document.getElementById('userInfo').innerText = `${userSession.nombre_usuario} (${userSession.tipo_usuario})`;
        }

        function logout() {
            localStorage.removeItem('user');
            window.location.href = '/';
        }
    </script>
</body>
</html>
