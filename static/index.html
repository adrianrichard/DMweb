<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentalMatic - Iniciar Sesión</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

    <div class="card login-card">
        <h2 style="text-align: center; color: #0288d1; margin-bottom: 1.5rem;">DentalMatic</h2>
        <h3 style="text-align: center; margin-bottom: 1rem; color: #555;">Iniciar Sesión</h3>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Ingresa tu usuario" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
            </div>
            
            <div id="errorMessage" style="color: #d32f2f; font-size: 0.9rem; margin-bottom: 1rem; display: none;"></div>
            
            <button type="submit" class="btn" style="width: 100%;">Ingresar</button>
        </form>
    </div>

    <script>
        // Validar sesión si ya existe
        try {
            const storedUser = localStorage.getItem('user');
            if (storedUser) {
                const user = JSON.parse(storedUser);
                if (user && user.nombre_usuario) {
                    window.location.href = '/dashboard';
                } else {
                    localStorage.removeItem('user');
                }
            }
        } catch (e) {
            localStorage.removeItem('user');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const errorDiv = document.getElementById('errorMessage');
            errorDiv.style.display = 'none';

            const nombreUsuario = document.getElementById('username').value.trim();
            const passUsuario = document.getElementById('password').value.trim();

            try {
                const respuesta = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nombre_usuario: nombreUsuario,
                        pass_usuario: passUsuario
                    })
                });

                if (respuesta.ok) {
                    const data = await respuesta.json();
                    localStorage.setItem('user', JSON.stringify(data.usuario));
                    window.location.href = '/dashboard';
                } else {
                    const error = await respuesta.json();
                    errorDiv.textContent = error.detail || 'Error al iniciar sesión';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Error de conexión con el servidor';
                errorDiv.style.display = 'block';
            }
        });
    </script>

</body>
</html>
