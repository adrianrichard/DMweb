<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DentalMatic - Pacientes</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="header-bar">
        <h1>DentalMatic - Pacientes</h1>
        <a href="/dashboard" class="btn">Volver al Dashboard</a>
    </div>
    <div class="container">
        <div class="card">
            <h2>Registrar Paciente</h2>
            <form id="pacienteForm" class="grid-2" style="margin-top: 1rem;">
                <div class="form-group"><input type="text" id="p_nombre" placeholder="Nombre *" required></div>
                <div class="form-group"><input type="text" id="p_apellido" placeholder="Apellido *" required></div>
                <div class="form-group"><input type="text" id="p_dni" placeholder="DNI *" required></div>
                <div class="form-group"><input type="date" id="p_fecha_nac"></div>
                <div class="form-group"><input type="text" id="p_telefono" placeholder="Teléfono"></div>
                <div class="form-group"><input type="email" id="p_email" placeholder="Email"></div>
                <div class="form-group"><input type="text" id="p_direccion" placeholder="Dirección"></div>
                <div><button type="submit" class="btn">Guardar Paciente</button></div>
            </form>
            <table>
                <thead>
                    <tr><th>ID</th><th>Nombre</th><th>DNI</th><th>Teléfono</th><th>Acciones</th></tr>
                </thead>
                <tbody id="tablaPacientes"></tbody>
            </table>
        </div>
    </div>
    <script>
        async function cargarPacientes() {
            const res = await fetch('/api/pacientes');
            const data = await res.json();
            document.getElementById('tablaPacientes').innerHTML = data.map(p => 
                `<tr>
                    <td>${p.id_paciente}</td>
                    <td>${p.nombre} ${p.apellido}</td>
                    <td>${p.dni}</td>
                    <td>${p.telefono || '-'}</td>
                    <td><button class="btn btn-danger" onclick="eliminarPaciente(${p.id_paciente})">Eliminar</button></td>
                </tr>`
            ).join('');
        }

        async function eliminarPaciente(id) {
            if (confirm("¿Desea eliminar este paciente?")) {
                const res = await fetch(`/api/pacientes/${id}`, { method: 'DELETE' });
                if (res.ok) cargarPacientes();
            }
        }

        document.getElementById('pacienteForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/pacientes', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    nombre: document.getElementById('p_nombre').value.trim(),
                    apellido: document.getElementById('p_apellido').value.trim(),
                    dni: document.getElementById('p_dni').value.trim(),
                    fecha_nacimiento: document.getElementById('p_fecha_nac').value || null,
                    telefono: document.getElementById('p_telefono').value.trim() || null,
                    email: document.getElementById('p_email').value.trim() || null,
                    direccion: document.getElementById('p_direccion').value.trim() || null
                })
            });
            if (res.ok) { e.target.reset(); cargarPacientes(); }
            else { const err = await res.json(); alert(err.detail || 'Error al guardar'); }
        });

        cargarPacientes();
    </script>
</body>
</html>
